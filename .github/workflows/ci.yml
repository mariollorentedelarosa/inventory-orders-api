name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compila, pasa los tests unitarios y los de integración (Testcontainers usa el Docker del runner)
      - name: Build y tests
        run: mvn -B verify
